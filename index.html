<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beacon - Student Tutoring Form Generator</title>
    <!-- Favicon updated to Violet 600 (#7c3aed) -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M40,90 L30,70 H70 L60,90 H40 Z' fill='%237c3aed'/%3E%3Cpath d='M40,70 V30 H60 V70 H40 Z' fill='%237c3aed'/%3E%3Cpath d='M50,25 a5,5 0 1 1 0,-10 a5,5 0 0 1 0,10 Z' fill='%23fbbf24'/%3E%3Cpath d='M20,20 L45,15' stroke='%23fbbf24' stroke-width='4'/%3E%3Cpath d='M80,20 L55,15' stroke='%23fbbf24' stroke-width='4'/%3E%3C/svg%3E" type="image/svg+xml">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse (CSV Parsing Library) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap');

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f8f9fa;
        }

        h1, h2, h3, button, .font-google {
            font-family: 'Google Sans', sans-serif;
        }

        #drop-zone {
            border: 2px dashed #dadce0;
            transition: all 0.2s ease-in-out;
        }

        #drop-zone.drag-over {
            border-color: #7c3aed;
            background-color: #f5f3ff;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #dadce0;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #7c3aed88;
        }
    </style>
</head>
<body class="antialiased text-gray-700">

    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-2xl bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">
            
            <!-- Violet 600 Header -->
            <div class="bg-violet-600 p-6 text-white relative">
                <div class="flex items-center space-x-4">
                    <div class="p-3 bg-white/20 rounded-lg">
                        <svg class="w-8 h-8 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold tracking-tight">Beacon</h1>
                        <p class="text-violet-100 text-sm opacity-90">Student Tutoring Form Generator</p>
                    </div>
                </div>
            </div>

            <div class="p-6 sm:p-8 space-y-8">
                
                <!-- Step 1: Upload -->
                <section>
                    <div class="flex items-center mb-4">
                        <span class="flex items-center justify-center w-6 h-6 rounded-full bg-violet-100 text-violet-700 text-xs font-bold mr-2">1</span>
                        <h2 class="text-lg font-medium text-gray-900">Upload Data</h2>
                    </div>
                    
                    <div class="ml-8">
                        <div id="drop-zone" class="relative rounded-xl p-8 text-center cursor-pointer hover:bg-gray-50 transition-colors">
                            <input type="file" id="file-input" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" accept=".csv">
                            <div class="flex flex-col items-center justify-center space-y-3 pointer-events-none">
                                <svg class="w-10 h-10 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.2" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l-3 3m3-3l3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z" />
                                </svg>
                                <p class="text-gray-600 text-sm">
                                    <span class="font-medium text-violet-600">Select CSV file</span> or drag and drop
                                </p>
                            </div>
                        </div>
                        <div id="file-list" class="mt-3 text-sm text-gray-600 font-medium"></div>
                    </div>
                </section>

                <hr class="border-gray-100">

                <!-- Step 2: Settings -->
                <section>
                    <div class="flex items-center mb-4">
                        <span class="flex items-center justify-center w-6 h-6 rounded-full bg-violet-100 text-violet-700 text-xs font-bold mr-2">2</span>
                        <h2 class="text-lg font-medium text-gray-900">Settings</h2>
                    </div>
                    
                    <div class="ml-8 grid grid-cols-1 sm:grid-cols-2 gap-8 items-start">
                        <div class="space-y-2">
                            <label for="passing-grade" class="block text-xs font-medium text-gray-600 uppercase tracking-wider">Passing Threshold</label>
                            <input type="number" id="passing-grade" value="65" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-violet-500 focus:border-violet-500 outline-none transition-all">
                        </div>
                        <div class="space-y-2">
                            <label for="sort-order" class="block text-xs font-medium text-gray-600 uppercase tracking-wider">Sort Priority By</label>
                            <select id="sort-order" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-violet-500 focus:border-violet-500 outline-none bg-white transition-all">
                                <option value="asc">Lowest Grade (Highest Priority)</option>
                                <option value="desc">Highest Grade (Lowest Priority)</option>
                            </select>
                        </div>
                    </div>

                    <div class="ml-8 mt-6">
                        <a href="#" id="download-template" class="inline-flex items-center text-violet-600 hover:text-violet-800 text-sm font-medium transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4 mr-1.5">
                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm.75-11.25a.75.75 0 00-1.5 0v4.59L7.3 9.7a.75.75 0 00-1.1 1.02l3.25 3.5a.75.75 0 001.1 0l3.25-3.5a.75.75 0 10-1.1-1.02l-1.95 2.1V6.75z" clip-rule="evenodd" />
                            </svg>
                            Download Beacon Template
                        </a>
                    </div>
                </section>

                <!-- Step 3: Action -->
                <section class="pt-4">
                    <button id="generate-btn" class="w-full bg-violet-600 text-white font-bold py-3.5 px-6 rounded-lg shadow hover:bg-violet-700 active:bg-violet-800 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:ring-offset-2 transition-all duration-200 flex items-center justify-center">
                        <svg id="icon-default" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 mr-2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
                        </svg>
                        <span id="btn-text">Generate Sign-Off Forms</span>
                    </button>
                    <p id="status-msg" class="text-center text-red-500 mt-4 text-sm font-medium h-5"></p>
                </section>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileListDisplay = document.getElementById('file-list');
        const passingGradeInput = document.getElementById('passing-grade');
        const sortOrderInput = document.getElementById('sort-order');
        const generateBtn = document.getElementById('generate-btn');
        const statusMsg = document.getElementById('status-msg');
        const downloadTemplateBtn = document.getElementById('download-template');
        const btnText = document.getElementById('btn-text');

        let uploadedFile = null;

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('drag-over'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            uploadedFile = Array.from(e.dataTransfer.files).find(f => f.type === 'text/csv' || f.name.endsWith('.csv'));
            updateFileList();
        });
        fileInput.addEventListener('change', () => { uploadedFile = fileInput.files[0]; updateFileList(); });

        function updateFileList() {
            if (uploadedFile) { fileListDisplay.innerHTML = `<span class="text-violet-600">Selected:</span> ${uploadedFile.name}`; statusMsg.textContent = ''; }
            else { fileListDisplay.innerHTML = ''; }
        }

        downloadTemplateBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const csvContent = "student_Id,Student_FirstName,Student_LastName,course_code,markingPeriod_Average,Teachers\n200000001,John,Doe,MGS21,62.5,Smith Jane(JSmith)";
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.setAttribute("href", URL.createObjectURL(blob));
            link.setAttribute("download", "beacon_template.csv");
            link.click();
        });

        generateBtn.addEventListener('click', async () => {
            if (!uploadedFile) { statusMsg.textContent = 'Please upload a CSV file.'; return; }
            setLoadingState(true);
            try {
                const passingGrade = parseFloat(passingGradeInput.value) || 65.0;
                const failingStudentsMap = await processStudentData(uploadedFile, passingGrade);
                const sortedStudents = processFailingStudents(failingStudentsMap, sortOrderInput.value);
                const reportHTML = generateFormsHTML(sortedStudents);
                const newWindow = window.open('', '_blank');
                if (newWindow) {
                    newWindow.document.write(reportHTML);
                    newWindow.document.close();
                    statusMsg.className = "text-center text-violet-600 mt-4 text-sm font-medium h-5";
                    statusMsg.textContent = 'Forms generated!';
                } else { throw new Error('Pop-up blocked.'); }
            } catch (error) { statusMsg.textContent = `Error: ${error.message}`; }
            finally { setLoadingState(false); }
        });

        function setLoadingState(isLoading) {
            btnText.textContent = isLoading ? 'Processing...' : 'Generate Sign-Off Forms';
            generateBtn.disabled = isLoading;
        }

        async function processStudentData(file, passingGrade) {
            const failingStudents = new Map();
            return new Promise((resolve, reject) => {
                Papa.parse(file, {
                    header: true, skipEmptyLines: true,
                    step: (row) => {
                        const data = row.data;
                        const studentId = data.student_Id?.trim();
                        if (!studentId) return;
                        const grade = parseFloat(data.markingPeriod_Average);
                        if (isNaN(grade) || grade >= passingGrade) return;
                        if (!failingStudents.has(studentId)) failingStudents.set(studentId, { id: studentId, name: `${data.Student_FirstName} ${data.Student_LastName}`, courses: {} });
                        failingStudents.get(studentId).courses[data.course_code?.trim() || 'N/A'] = { grade, teacher: String(data.Teachers).split(/\s*\(/)[0].trim() };
                    },
                    complete: () => resolve(failingStudents),
                    error: (err) => reject(err)
                });
            });
        }

        function processFailingStudents(map, sortOrder) {
            const arr = [];
            map.forEach((data, id) => {
                const list = Object.entries(data.courses).map(([code, d]) => ({ course: code, grade: d.grade, teacher: d.teacher }));
                list.sort((a, b) => sortOrder === 'asc' ? a.grade - b.grade : b.grade - a.grade);
                arr.push({ id, name: data.name, courses: list });
            });
            return arr.sort((a, b) => a.name.localeCompare(b.name));
        }

        function generateFormsHTML(sortedStudents) {
            return `
            <!DOCTYPE html>
            <html>
            <head>
                <style>
                    @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap');
                    body { font-family: 'Roboto', sans-serif; margin: 0; padding: 0; background: #f1f3f4; color: #202124; }
                    .form-container { width: 8.5in; min-height: 11in; padding: 0.75in; margin: 20px auto; background: white; box-sizing: border-box; }
                    h1 { font-family: 'Google Sans', sans-serif; font-size: 20px; text-align: center; color: #7c3aed; border-bottom: 2px solid #7c3aed; padding-bottom: 10px; }
                    .student-header { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 25px; border: 1px solid #dadce0; }
                    .student-header span { font-family: 'Google Sans', sans-serif; font-weight: 500; font-size: 18px; color: #202124; }
                    .intro-text { font-size: 14px; margin-bottom: 25px; line-height: 1.6; }
                    h2 { font-family: 'Google Sans', sans-serif; font-size: 16px; margin: 30px 0 15px 0; color: #7c3aed; text-transform: uppercase; letter-spacing: 0.5px; }
                    .priority-card { border: 1px solid #dadce0; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
                    .sign-off { margin-top: 40px; border: 2px dashed #dadce0; border-radius: 12px; padding: 25px; }
                    .sig-line { border-bottom: 1px solid #202124; width: 250px; margin: 15px 10px 0 0; display: inline-block; }
                    .box { width: 18px; height: 18px; border: 2px solid #202124; margin-right: 12px; display: inline-block; vertical-align: middle; }
                    #print-bar { position: sticky; top: 0; background: white; padding: 15px 0; border-bottom: 1px solid #eee; z-index: 100; text-align: center; }
                    button { background: #7c3aed; color: white; border: none; padding: 12px 24px; border-radius: 4px; font-family: 'Google Sans', sans-serif; cursor: pointer; }
                    @media print { #print-bar { display: none; } body { background: white; } .form-container { margin: 0; page-break-after: always; } }
                </style>
            </head>
            <body>
                <div id="print-bar"><button onclick="window.print()">Print Forms</button></div>
                ${sortedStudents.map(s => `
                    <div class="form-container">
                        <h1>Mandated Tutoring Attendance Form</h1>
                        <div class="student-header"><span>Student: ${s.name}</span><div style="font-size: 12px; color: #5f6368;">ID: ${s.id}</div></div>
                        <p class="intro-text">Attend tutoring for the following classes. Have a teacher sign to verify attendance.</p>
                        <h2>Priorities</h2>
                        ${s.courses.slice(0, 3).map((c, i) => `
                            <div class="priority-card"><div style="font-size:10px; font-weight:bold; color:#7c3aed">PRIORITY ${i+1}</div>
                            <div style="font-size:13px"><strong>${c.course}</strong> - ${c.teacher} (${c.grade.toFixed(1)})</div></div>`).join('')}
                        <div class="sign-off">
                            <h2 style="margin-top:0">Teacher Verification</h2>
                            ${s.courses.slice(0, 2).map(c => `<div style="margin-bottom:10px"><div class="box"></div><span style="font-size:14px">${c.teacher} (${c.course})</span></div>`).join('')}
                            <div style="margin-top:30px"><div class="sig-line"></div><div style="font-size:10px">TEACHER SIGNATURE</div></div>
                        </div>
                    </div>`).join('')}
            </body>
            </html>`;
        }
    </script>
</body>
</html>
